name: langbar_core
description: "A Flutter library for natural language interface components that integrate with LLMs using LangChain.dart"
version: 0.1.0
homepage: https://github.com/hansvandam/langbar_core
repository: https://github.com/hansvandam/langbar_core
issue_tracker: https://github.com/hansvandam/langbar_core/issues
topics:
  - flutter
  - llm
  - langchain
  - natural-language
  - ai
  - voice-interface

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  langchain: ^0.7.6
  langchain_openai: ^0.7.6+1
  langchain_google: ^0.6.1
  #  ollama_dart: ^0.0.2
  langchain_ollama: ^0.3.3+2
  langchain_pinecone: ^0.1.0+7
  go_router: ^16.2.1
  flutter_tts: ^4.2.3
  sqflite: ^2.4.2
  flutter_bloc: ^9.1.1
  encrypt: ^5.0.3
  speech_to_text: ^7.3.0
  logger: ^2.6.1
  equatable: ^2.0.7
  flutter_dotenv: ^6.0.0

  provider: ^6.1.5+1
  get_it: ^7.7.0
  langchain_core: ^0.3.9
  path: ^1.9.1
  http: ^1.5.0
  meta: ^1.16.0
  pinecone: ^0.7.2
  uuid: ^4.5.1
  web_socket_channel: ^3.0.1
  json_rpc_2: ^3.0.2
  async: ^2.11.0
  window_manager: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

